key: access-emergency-use-recorded
title: Emergency access recorded
statement: >-
  Each use of the cloud account's root user is recorded within one business
  day, with the reason and the person who used it.
risk: Use of the most powerful identity goes unexplained.
owner_role: control-owner
type: manual
checks: []
manual_evidence:
  expectation: >-
    The record of root user use for the period, or a dated statement that
    there was none.
  validity_months: 12
evidence_expectation: >-
  A log of root user use: date, person, reason. An empty log for a period with
  no root use is evidence too.
reviewer_note: ""
review:
