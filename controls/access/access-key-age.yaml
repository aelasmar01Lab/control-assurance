key: access-key-age
title: Access keys rotated within 90 days
statement: >-
  Every active IAM user access key in the cloud account is less than 90 days
  old.
risk: A key that leaked long ago still works.
owner_role: control-owner
type: automated
checks: []
evidence_expectation: >-
  Access key creation dates in the IAM credential report, collected at least
  every 48 hours.
