key: credential-lifecycle
title: Credential lifecycle
statement: >-
  No IAM console password or active access key goes unused for more than 90
  days, and the root user has no access keys.
risk: >-
  A credential nobody uses stays valid until someone else finds it.
owner_role: control-owner
type: automated
checks: [AWS-02]
evidence_expectation: >-
  The IAM credential report and account summary, collected at least every 48
  hours.
freshness_hours: 48
reviewer_note: >-
  This control joins two activities: unused credentials, and root access keys.
  The writing rules would make it two controls. It is kept whole because its
  key comes from the first release; split it or keep it.
