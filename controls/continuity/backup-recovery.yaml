key: backup-recovery
title: Backup and recovery
statement: >-
  A recovery exercise is carried out at least every 12 months, and a reviewer
  accepts its record.
risk: >-
  Data cannot be restored after loss because recovery has never been
  exercised.
owner_role: control-owner
type: manual
checks: [REC-01]
manual_evidence:
  expectation: >-
    A dated record of a recovery exercise, saying what was restored and from
    what.
  validity_months: 12
evidence_expectation: >-
  A dated recovery exercise record, accepted by a reviewer, covering a period
  that ended within the last 12 months.
reviewer_note: ""
review:
  status: draft
  drafted_by: agent
  reviewed_by: ""
  reviewed_on: ""
  content_sha256: ""
