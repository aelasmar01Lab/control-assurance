name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cca
          POSTGRES_PASSWORD: cca_ci_only
          POSTGRES_DB: cca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cca -d cca"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Database tests fail, rather than skip, when this is missing in CI.
      CCA_TEST_DATABASE_URL: postgres://cca:cca_ci_only@127.0.0.1:5432/cca?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate framework packs
        run: go run ./cmd/cca packs validate

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cca
          POSTGRES_PASSWORD: cca_ci_only
          POSTGRES_DB: cca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cca -d cca"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cca:cca_ci_only@127.0.0.1:5432/cca?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Apply migrations to an empty database
        run: go run ./cmd/cca migrate up
      - name: Applying again is a no-op
        run: go run ./cmd/cca migrate up | grep -q "no pending migrations"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the demo image
        run: docker build -t cca:ci .
      - name: The binary runs as an unprivileged user
        run: |
          docker run --rm cca:ci version
          test "$(docker run --rm --entrypoint id cca:ci -u)" != "0"
