{{define "content"}}
<div class="card table-card">
  {{if .Data}}
  <table class="table">
    <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Object</th><th>Reason</th></tr></thead>
    <tbody>
    {{range .Data}}
    <tr>
      <td class="time">{{when .At}}</td>
      <td class="small nowrap">{{.Actor}} <span class="xs faint">({{label .ActorRole}})</span></td>
      <td class="nowrap"><code class="chip action">{{.Action}}</code></td>
      <td class="small nowrap">{{label .ObjectType}} {{.ObjectID}}</td>
      <td class="body">{{.Reason}}</td>
    </tr>
    {{end}}
    </tbody>
  </table>
  {{else}}<p class="empty">Nothing has been logged yet.</p>{{end}}
</div>
{{end}}
