{{define "content"}}
<form method="post" action="/login" class="card elev-md">
  <h2>Sign in</h2>
  {{if .Data}}<p class="flash error" role="alert"><i class="ph ph-warning"></i><span>{{.Data}}</span></p>{{end}}
  <label class="field"><span>Username</span><input class="input" name="username" autocomplete="username" required autofocus></label>
  <label class="field"><span>Password</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit" class="btn btn-primary btn-block">Sign in</button>
</form>
<p class="small muted pretty">Lab accounts only: operator, control-owner, reviewer and auditor. Passwords are printed once by <code>cca users seed</code>.</p>
{{end}}
