<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Control assurance</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="bar">
    <h1>Control assurance</h1>
    {{if .Actor}}
    <form method="post" action="/logout" class="who">
      <span>{{.Actor.Username}} <span class="dim">({{label .Actor.Role}})</span></span>
      <button type="submit" class="plain">Sign out</button>
    </form>
    {{end}}
  </div>
  {{if .Actor}}
  <nav>
    <a href="/">Overview</a>
    <a href="/findings">Findings</a>
    <a href="/evidence">Manual evidence</a>
    <a href="/log">Decision log</a>
    <a href="/export.json">Export</a>
  </nav>
  {{end}}
</header>
<main>
{{if .Flash}}<p class="flash" role="status">{{.Flash}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>
