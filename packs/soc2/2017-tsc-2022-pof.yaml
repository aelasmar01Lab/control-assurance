# SOC 2: the AICPA's trust services criteria, identifiers only.
#
# The criteria are copyright AICPA and may not be redistributed. This pack
# carries each criterion's identifier, its place in the hierarchy, and a
# label in this project's own words that names the topic. It carries no
# AICPA title and no AICPA text, and the points of focus are left out.
# Read the criteria themselves in the publisher's document.
#
# Identifiers were read from the maintainer's copy of the publisher's PDF,
# which is kept outside the repository. The series identifiers (CC1 to CC9)
# and the category letters are the document's own; they are headings here.
# Written by hand; a new release is a new pack file.
