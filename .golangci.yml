version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    rules:
      # Writes to the CLI's own stdout/stderr; a failure has nowhere to be reported.
      - linters: [errcheck]
        source: 'fmt\.Fp'

formatters:
  enable:
    - gofmt
    - goimports
