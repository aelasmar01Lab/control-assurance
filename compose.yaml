# Local development database. Credentials here are for local use only.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cca_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-cca}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10


# The seeded demo: `make demo`, or `docker compose --profile demo up --build demo`.
# It has its own throwaway database, so it never touches the development one,
# and it starts from the same synthetic history every time.
  demo-db:
    profiles: [demo]
    image: postgres:18
    environment:
      POSTGRES_USER: cca
      POSTGRES_PASSWORD: cca_demo_only
      POSTGRES_DB: cca_demo
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cca -d cca_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo:
    profiles: [demo]
    build: .
    command: ["demo"]
    environment:
      DATABASE_URL: postgres://cca:cca_demo_only@demo-db:5432/cca_demo?sslmode=disable
      CCA_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${CCA_DEMO_PORT:-8080}:8080"
    depends_on:
      demo-db:
        condition: service_healthy

volumes:
  pgdata:
