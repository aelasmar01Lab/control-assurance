# The lab: SOC 2 criteria that no control covers, and how each is tracked.
#
# PILOT: only the CC6 series has been assessed. Every other criterion is
# marked not_assessed: nobody has looked at it yet, nothing is claimed about
# it, and there is nothing to review. Wave 1 replaces each with controls and
# mappings, or with a tracking entry that says how it is tracked.
