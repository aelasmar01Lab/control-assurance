  - requirement: CC6.4
    status: out_of_scope
    owner_role: control-owner
    applicability: Not applicable.
    evidence_expectation: >-
      None.
    rationale: >-
      The lab has no office, data centre or other premises. Its systems run in a
      cloud provider's facilities and on a code host, whose physical security is
      theirs.
    reviewer_note: ""
    review:
      status: draft
      drafted_by: agent
      reviewed_by: ""
      reviewed_on: ""
      content_sha256: ""

  - requirement: CC6.5
    status: not_implemented
    owner_role: control-owner
    applicability: Applicable to the one laptop the lab is run from.
    evidence_expectation: >-
      A dated record that the disk was erased, or was encrypted and its key
      destroyed, before the laptop left the maintainer's hands.
    rationale: >-
      No procedure covers erasing the maintainer's laptop before disposal.
      Storage in the cloud account is the provider's hardware.
    reviewer_note: ""
    review:
      status: draft
      drafted_by: agent
      reviewed_by: ""
      reviewed_on: ""
      content_sha256: ""

  - requirement: CC6.7
    status: not_implemented
    owner_role: control-owner
    applicability: Applicable.
    evidence_expectation: >-
      Configuration showing that evidence and credentials move only over
      encrypted channels, and what protects the laptop they are handled on.
    rationale: >-
      No control addresses how information is moved or transmitted. Collection
      uses the providers' HTTPS APIs, but nothing here checks or records that.
    reviewer_note: ""
    review:
      status: draft
      drafted_by: agent
      reviewed_by: ""
      reviewed_on: ""
      content_sha256: ""

  - requirement: CC6.8
    status: not_implemented
    owner_role: control-owner
    applicability: Applicable.
    evidence_expectation: >-
      Evidence of how unwanted or harmful software is kept out of the
      laptop and out of the build.
    rationale: >-
      No control in the pilot addresses malicious software. The dependency and
      change controls are related and have not been mapped to SOC 2 yet.
    reviewer_note: ""
    review:
      status: draft
      drafted_by: agent
      reviewed_by: ""
      reviewed_on: ""
      content_sha256: ""

